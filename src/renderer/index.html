<!doctype html>
<html lang="en-GB" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FilmScriptWriter</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar" role="banner">
        <img class="toolbar-mark" id="toolbar-mark" alt="" width="24" height="24" />
        <span class="toolbar-brand">FilmScriptWriter</span>
        <span class="toolbar-spacer"></span>
        <button type="button" id="btn-new" data-i18n="toolbar.new">New</button>
        <button type="button" id="btn-open" data-i18n="toolbar.open">Open</button>
        <button type="button" id="btn-save" data-i18n="toolbar.save">Save</button>
        <button type="button" id="btn-save-as" data-i18n="toolbar.saveAs">Save as</button>
        <button type="button" id="btn-right-toggle" data-i18n="toolbar.preview">Preview</button>
        <button type="button" id="btn-settings" data-i18n="toolbar.settings">Settings</button>
      </header>

      <main class="workspace" id="workspace">
        <aside class="files-pane" id="files-pane" aria-label="Scripts">
          <header class="files-head">
            <strong id="files-title">Scripts</strong>
            <span>
              <button type="button" id="btn-refresh-files" title="Refresh">↻</button>
              <button type="button" id="btn-collapse-files" title="Hide">‹</button>
            </span>
          </header>
          <div class="files-body" id="files-body"></div>
        </aside>
        <button type="button" class="files-expand hidden" id="btn-expand-files" title="Show">›</button>
        <div class="resizer" id="resizer-files" role="separator" aria-orientation="vertical"></div>
        <section class="editor-pane" id="editor-pane"></section>
        <div class="resizer" id="resizer-right" role="separator" aria-orientation="vertical"></div>
        <aside class="right-pane" id="right-pane">
          <div class="preview-host" id="preview-host"></div>
          <div class="fountain-help hidden" id="fountain-help"></div>
        </aside>
      </main>

      <footer class="status-bar" role="contentinfo">
        <span class="status-item" id="status-file">Untitled</span>
        <span class="status-dot" aria-hidden="true">·</span>
        <span class="status-item" id="status-pages">1 Pages</span>
        <span class="status-dot" aria-hidden="true">·</span>
        <span class="status-item" id="status-locale">English (UK)</span>
        <span class="status-dot" aria-hidden="true">·</span>
        <span class="status-item" id="status-dirty">Ready</span>
      </footer>
    </div>

    <div class="modal hidden" id="settings-modal" role="dialog" aria-modal="true">
      <div class="modal-card" id="settings-card"></div>
    </div>

    <div class="modal hidden" id="about-modal" role="dialog" aria-modal="true">
      <div class="modal-card about-card" id="about-card"></div>
    </div>

    <div class="modal hidden" id="new-modal" role="dialog" aria-modal="true">
      <div class="modal-card new-card" id="new-card"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
